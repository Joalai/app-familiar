name: Integrate app enhancements

on:
  push:
    branches: [main]
    paths:
      - 'app-enhancements.js'
      - 'calendar-races-update.js'
      - 'packing.js'
      - '.github/workflows/integrate-enhancements.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate enhancements in index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          VERSION='2026.09.09.1'
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r"const APP_VERSION='[^']+';", f"const APP_VERSION='{VERSION}';", s)
          for script in ['app-enhancements.js','calendar-races-update.js','packing.js']:
              pat=rf'<script src="{re.escape(script)}\?v=[^"]+"></script>'
              tag=f'<script src="{script}?v={VERSION}"></script>'
              s=re.sub(pat,tag,s)
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>')
          p.write_text(s)
          Path('version.json').write_text('{"version":"'+VERSION+'"}\n')
          PY
      - name: Commit integrated page
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git commit -m "Publish packing lists and race date corrections"
          git push
