name: Validate app stability

on:
  push:
    branches:
      - main
      - 'stabilization/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in ./*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check stable architecture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, sys

          errors=[]
          index=Path('index.html').read_text()
          sw=Path('service-worker.js').read_text()
          nav=Path('navigation-fix.js').read_text()
          tasks=Path('tasks.js').read_text()
          sync=Path('sync-fix.js').read_text()
          upgrades=Path('family-upgrades.js').read_text()
          upgrades_fix=Path('family-upgrades-fix.js').read_text()
          priority=Path('section-priority-fix.js').read_text()
          notifications=Path('notification-fix.js').read_text()

          scripts=re.findall(r'<script src="([^"]+)"',index)
          names=[x.split('?')[0] for x in scripts]
          for required in ['tasks.js','sync-fix.js','cars-v2.js','section-priority-fix.js','stability-core.js']:
              if names.count(required)!=1:
                  errors.append(f'{required} must be loaded exactly once; found {names.count(required)}')
          if 'cars-fallback.js' in names:
              errors.append('cars-fallback.js is legacy and must not be loaded')
          if len(names)!=len(set(names)):
              errors.append('duplicate script tags found in index.html')

          forbidden=[
              ('navigation-fix.js',nav,"createElement('script')",'dynamic legacy script loading'),
              ('family-upgrades.js',upgrades,'ensureCars(','duplicate cars module'),
              ('family-upgrades-fix.js',upgrades_fix,'syncCars(','legacy cars enhancer'),
              ('tasks.js',tasks,'setInterval(sync','task polling'),
              ('section-priority-fix.js',priority,'setInterval(enhancePrioritySections','layout polling'),
              ('notification-fix.js',notifications,'setInterval(()=>nfRefresh','notification polling'),
              ('service-worker.js',sw,'client.navigate(','forced live reload'),
              ('service-worker.js',sw,'const scripts=','service worker script injection'),
          ]
          for file,text,needle,label in forbidden:
              if needle in text:
                  errors.append(f'{file}: forbidden {label}')

          if "document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&CODE)load()})" in index:
              errors.append('index.html must not full-load data on visibilitychange')
          if "setInterval(()=>{if(CODE&&document.visibilityState==='visible')load()}" in index:
              errors.append('index.html must not full-load data on a timer')

          version=json.loads(Path('version.json').read_text())['version']
          m=re.search(r"const APP_VERSION='([^']+)'",index)
          s=re.search(r"const APP_PATCH_VERSION='([^']+)'",sw)
          if not m or m.group(1)!=version:
              errors.append(f'index APP_VERSION does not match version.json ({version})')
          if not s or s.group(1)!=version:
              errors.append(f'service worker version does not match version.json ({version})')

          if errors:
              print('\n'.join('ERROR: '+e for e in errors))
              sys.exit(1)
          print('Stable architecture checks passed.')
          PY
