<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8"><title>Familia</title>
<style>
:root{--bg:#f4f6f8;--ink:#16181b;--mut:#707783;--line:#e4e7eb;--j:#8b5cf6;--l:#14b8a6;--a:#f59e0b;--ath:#e11d48;--bb:#475569;--ses:#16a34a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1100px;margin:auto}header{position:sticky;top:0;z-index:10;background:#f4f6f8f2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 8px}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:#16181b;color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{margin:0;font-size:19px}.sub{font-size:11px;color:var(--mut)}.sync{font-size:10px;color:#28663d;background:#eaf8ef;border:1px solid #cde9d6;padding:6px 8px;border-radius:999px}.nav{display:flex;gap:4px;overflow:auto;padding:0 10px 10px}.nav button{border:0;background:transparent;padding:8px 10px;border-radius:9px;color:var(--mut);font-weight:750;white-space:nowrap}.nav button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px #0001}main{padding:12px}.view{display:none}.view.on{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 22px #16202b0b}.pad{padding:14px}.title{font-size:24px;font-weight:900;margin:2px 0 12px}.ey{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);font-weight:900}.group{border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:9px;background:#fff}.ghead{padding:7px 9px;background:#fafbfc;color:var(--mut);font-size:10px;font-weight:900;border-bottom:1px solid var(--line)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px;padding:7px}.ev{display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px}.date{border:1px solid var(--line);border-radius:9px;text-align:center;background:#fff;overflow:hidden}.date span{display:block;font-size:8px;background:#f1f3f5;font-weight:900}.date b{font-size:18px}.date small{font-size:8px;font-weight:800}.ev strong{font-size:11px}.ev em{display:block;font-style:normal;font-size:9px;color:var(--mut);margin-top:3px}.athletic{background:#e11d4814}.bilbao-basket{background:#47556914}.sestao-river{background:#16a34a14}.family{background:#2563eb14}.split{background:linear-gradient(90deg,#8b5cf62a 0 50%,#14b8a62a 50%)}.joane{background:#8b5cf620}.laia{background:#14b8a620}.alain{background:#f59e0b26}.period{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;margin-bottom:8px}.period button{height:34px;border:0;border-radius:9px;background:#fff;font-size:22px}.period strong{text-align:center}.weekwrap,.monthwrap{overflow-x:auto}.week{min-width:800px}.wh,.wr{display:grid;grid-template-columns:48px repeat(7,1fr)}.wh div{text-align:center;padding:7px 2px;border-left:1px solid var(--line);font-size:10px;font-weight:900}.wh b{display:block;font-size:17px}.early{min-height:48px;border-left:1px solid var(--line);padding:3px}.early .mini{font-size:8px;border:1px solid #0001;border-radius:6px;padding:3px;margin:2px 0}.axis,.tl{position:relative;height:350px}.axis{border-right:1px solid var(--line)}.tick{position:absolute;right:3px;font-size:8px;color:var(--mut)}.tl{border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 38px,#eceff2 39px)}.block{position:absolute;left:3px;right:3px;border:1px solid #0001;border-radius:7px;padding:4px;font-size:8px;font-weight:800;overflow:hidden}.people{position:absolute;left:4px;right:4px;bottom:3px;display:flex;justify-content:space-between}.people i{font-style:normal;width:15px;height:15px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:7px}.people i:first-child{background:var(--j)}.people i:last-child{background:var(--l)}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:3px;min-width:790px}.wd{text-align:center;font-size:8px;color:var(--mut);font-weight:900}.day{min-height:80px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:3px}.day.off{opacity:.22}.num{font-size:10px;font-weight:900}.chip{font-size:7px;border-radius:4px;padding:2px 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tools{display:grid;grid-template-columns:.8fr 1.2fr;gap:10px}.form{display:grid;gap:8px}.field{display:grid;gap:4px}.field label{font-size:9px;font-weight:900;color:var(--mut)}input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff}.primary{border:0;background:#16181b;color:#fff;border-radius:9px;padding:10px 12px;font-weight:850}.item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.item.done .name{text-decoration:line-through;color:var(--mut)}.name{font-weight:850}.meta{font-size:10px;color:var(--mut)}.x{border:0;background:#f1f3f5;border-radius:8px;width:30px;height:30px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-weight:850}.tabs button.on{outline:2px solid #16181b}.login{position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;place-items:center;padding:20px}.login.hide{display:none}.loginbox{width:min(360px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center}.loginbox input{text-transform:uppercase;text-align:center;font-size:17px;letter-spacing:.08em;margin:8px 0}.err{color:#b42318;font-size:11px;min-height:15px;margin-top:6px}
@media(max-width:700px){.tools{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><div class="logo" style="margin:auto">F</div><h2>App Familiar</h2><p class="sub">Código familiar compartido</p><input id="code" placeholder="Código"><button id="enter" class="primary">Entrar</button><div id="err" class="err"></div></div></div>
<div class="app"><header><div class="top"><div class="brand"><div class="logo">F</div><div><h1>Familia</h1><div class="sub">Agenda compartida</div></div></div><div id="sync" class="sync">Conectando…</div></div><div id="nav" class="nav"></div></header>
<main>
<section id="home" class="view on"><div class="ey">Próximos acontecimientos</div><div class="title">Lo que viene</div><div id="coming"></div></section>
<section id="week" class="view"><div class="period"><button data-w="-1">‹</button><strong id="wt"></strong><button data-w="1">›</button></div><div class="card weekwrap"><div id="wb" class="week"></div></div></section>
<section id="month" class="view"><div class="period"><button data-m="-1">‹</button><strong id="mt"></strong><button data-m="1">›</button></div><div class="card pad monthwrap"><div id="mb"></div></div></section>
<section id="shop" class="view"><div class="tools"><div class="card pad"><div class="ey">Lista familiar</div><div class="title">Compras</div><div class="form"><div class="field"><label>Producto</label><input id="sn"></div><div class="field"><label>Categoría</label><select id="sc"><option>Supermercado</option><option>Ropa</option><option>Colegio</option><option>Deporte</option><option>Casa</option><option>Regalo</option><option>Otro</option></select></div><div class="field"><label>Detalle</label><input id="sd"></div><button id="as" class="primary">Añadir</button></div></div><div class="card pad"><div class="title" style="font-size:18px">Pendiente</div><div id="shopping"></div></div></div></section>
<section id="plans" class="view"><div class="tools"><div class="card pad"><div class="ey">Invitaciones y excepciones</div><div class="title">Cumples y planes</div><div class="form"><div class="field"><label>Tipo</label><select id="pt"><option value="cumpleaños">Cumpleaños</option><option value="fiesta">Fiesta</option><option value="evento escolar">Evento escolar</option><option value="plan">Plan</option><option value="otro">Otro</option></select></div><div class="field"><label>Nombre</label><input id="pn"></div><div class="field"><label>Quién</label><select id="pw"><option>Joane</option><option>Laia</option><option>Alain</option><option>Familia</option></select></div><div class="field"><label>Fecha</label><input id="pd" type="date"></div><div class="field"><label>Hora</label><input id="ph" type="time"></div><div class="field"><label>Lugar</label><input id="pp"></div><div class="field"><label>Notas</label><textarea id="pnotes"></textarea></div><button id="ap" class="primary">Guardar</button></div></div><div class="card pad"><div class="title" style="font-size:18px">Próximos</div><div id="plist"></div></div></div></section>
<section id="sports" class="view"><div class="period"><button data-s="-1">‹</button><strong id="st"></strong><button data-s="1">›</button></div><div class="card pad monthwrap"><div id="sb"></div></div></section>
<section id="cal" class="view"><div id="ctabs" class="tabs"></div><div class="card pad" id="cbody"></div></section>
</main></div>
<script>
const SUPA='https://gjplhfinujyhjxpahcak.supabase.co';
const KEY='sb_publishable_8WLfOB17Uhnyd9jNWFdyDA_ewE7yxVO';
let CODE=localStorage.getItem('family_code')||'',D={events:[],shopping:[],recurring:[],members:[]},W=new Date(),M=new Date(),S=new Date(),C='Todos';
const $=id=>document.getElementById(id), colors={Joane:'joane',Laia:'laia',Alain:'alain',Athletic:'athletic','Bilbao Basket':'bilbao-basket','Sestao River':'sestao-river',Familia:'family'};
const navs=[['home','Inicio'],['week','Semana'],['month','Mes'],['shop','Compras'],['plans','Cumples'],['sports','Deporte'],['cal','Calendarios']];
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function mon(d){let x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function fmt(d,o={day:'numeric',month:'short'}){return new Intl.DateTimeFormat('es-ES',o).format(d)}
async function rpc(name,args){let r=await fetch(SUPA+'/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(args)});if(!r.ok)throw Error((await r.text())||r.status);return r.status===204?null:r.json()}
async function load(){try{D=await rpc('family_get_data',{p_code:CODE});$('login').classList.add('hide');$('sync').textContent='Sincronizado';renderAll()}catch(e){$('login').classList.remove('hide');$('err').textContent=CODE?'Código incorrecto':'';$('sync').textContent='Sin conexión'}}
function initnav(){navs.forEach(([v,t])=>{let b=document.createElement('button');b.textContent=t;b.dataset.v=v;b.onclick=()=>show(v);$('nav').append(b)});$('nav').firstChild.classList.add('on')}
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));if(v==='week')rw();if(v==='month')rm();if(v==='sports')rs();if(v==='cal')rc()}
function ce(e){return colors[e.source_ref]||colors[(e.member_names||[])[0]]||'family'}
function db(ds){let d=new Date(ds+'T12:00:00'),wd=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][d.getDay()],mo=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][d.getMonth()];return `<div class="date"><span>${wd}</span><b>${d.getDate()}</b><small>${mo}</small></div>`}
function rh(){let n=iso(new Date()),e=new Date();e.setDate(e.getDate()+60);let a=D.events.filter(x=>x.event_date>=n&&x.event_date<=iso(e)).sort((x,y)=>x.event_date.localeCompare(y.event_date)||(x.start_time||'99').localeCompare(y.start_time||'99')),g={};a.forEach(x=>{let k=iso(mon(new Date(x.event_date+'T12:00:00')));(g[k]??=[]).push(x)});$('coming').innerHTML=Object.entries(g).map(([k,x])=>{let d=new Date(k+'T12:00:00'),z=new Date(d);z.setDate(z.getDate()+6);return `<div class="group"><div class="ghead">SEMANA · ${fmt(d)} – ${fmt(z)}</div><div class="cards">${x.map(a=>`<div class="ev ${ce(a)}">${db(a.event_date)}<div><strong>${esc(a.title)}</strong><em>${a.start_time?a.start_time.slice(0,5):'Hora pendiente'}${a.place?' · '+esc(a.place):''}</em></div></div>`).join('')}</div></div>`}).join('')||'<div class="card pad">Nada excepcional próximo.</div>'}
function rf(d){let wd=((d.getDay()+6)%7)+1,ds=iso(d);return D.recurring.filter(a=>a.weekday===wd&&(!a.valid_from||ds>=a.valid_from)&&(!a.valid_until||ds<=a.valid_until))}
function ef(d){return D.events.filter(e=>e.event_date===iso(d))}
function rw(){let m=mon(W),ds=[0,1,2,3,4,5,6].map(i=>{let d=new Date(m);d.setDate(d.getDate()+i);return d});$('wt').textContent=fmt(ds[0])+' – '+fmt(ds[6]);let h=`<div class="wh"><div></div>${ds.map(d=>`<div>${fmt(d,{weekday:'short'})}<b>${d.getDate()}</b></div>`).join('')}</div><div class="wr"><div class="label">ANTES 16:30</div>${ds.map(d=>`<div class="early">${ef(d).filter(e=>!e.start_time||e.start_time<'16:30').map(e=>`<div class="mini ${ce(e)}">${e.start_time?e.start_time.slice(0,5):'Pend.'} ${esc(e.title)}</div>`).join('')}</div>`).join('')}</div>`;let axis=`<div class="axis">${[17,18,19,20,21].map(x=>`<span class="tick" style="top:${(x*60-990)*1.25-4}px">${x}:00</span>`).join('')}</div>`;let tls=ds.map(d=>{let a=[...rf(d).map(x=>({...x,k:'r'})),...ef(d).filter(e=>e.start_time&&e.start_time>='16:30').map(x=>({...x,k:'e'}))];return `<div class="tl">${a.map(x=>{let st=(x.start_time||'16:30').slice(0,5),[hh,mm]=st.split(':').map(Number),start=hh*60+mm,end=start+60;if(x.end_time){let [eh,em]=x.end_time.slice(0,5).split(':').map(Number);end=eh*60+em}else if(x.k==='e')end=start+90;let mem=x.member_names||[],cl=x.k==='r'&&mem.length===2?'split':ce(x),pe=mem.length===2?'<div class="people"><i>J</i><i>L</i></div>':'';return `<div class="block ${cl}" style="top:${(start-990)*1.25}px;height:${Math.max(26,(end-start)*1.25)}px">${st} ${esc(x.title)}${pe}</div>`}).join('')}</div>`}).join('');$('wb').innerHTML=h+`<div class="wr">${axis}${tls}</div>`}
function cells(d,sport=false){let f=new Date(d.getFullYear(),d.getMonth(),1,12),st=mon(f),o=[];for(let i=0;i<42;i++){let x=new Date(st);x.setDate(x.getDate()+i);let es=ef(x).filter(e=>!sport||e.category==='sport'),rs=sport?[]:rf(x),ch=[...rs.map(a=>({t:a.title,c:(a.member_names||[]).length===2?'split':colors[(a.member_names||[])[0]]||'family'})),...es.map(a=>({t:(a.start_time?a.start_time.slice(0,5)+' ':'')+a.title,c:ce(a)}))];o.push(`<div class="day ${x.getMonth()!==d.getMonth()?'off':''}"><div class="num">${x.getDate()}</div>${ch.slice(0,5).map(z=>`<div class="chip ${z.c}">${esc(z.t)}</div>`).join('')}</div>`)}return `<div class="calgrid">${['L','M','X','J','V','S','D'].map(x=>`<div class="wd">${x}</div>`).join('')}${o.join('')}</div>`}
function rm(){$('mt').textContent=fmt(M,{month:'long',year:'numeric'});$('mb').innerHTML=cells(M,false)}
function rs(){$('st').textContent=fmt(S,{month:'long',year:'numeric'});$('sb').innerHTML=cells(S,true)}
function rshop(){let a=[...D.shopping].sort((x,y)=>Number(x.is_done)-Number(y.is_done));$('shopping').innerHTML=a.length?a.map(x=>`<div class="item ${x.is_done?'done':''}"><input data-ck="${x.id}" type="checkbox" ${x.is_done?'checked':''}><div><div class="name">${esc(x.item_name)}</div><div class="meta">${esc(x.category||'')}${x.detail?' · '+esc(x.detail):''}</div></div><button class="x" data-del="${x.id}">×</button></div>`).join(''):'<div class="meta">Lista vacía.</div>';document.querySelectorAll('[data-ck]').forEach(x=>x.onchange=async()=>{await rpc('family_set_shopping_done',{p_code:CODE,p_id:x.dataset.ck,p_is_done:x.checked});await load()});document.querySelectorAll('[data-del]').forEach(x=>x.onclick=async()=>{await rpc('family_delete_shopping',{p_code:CODE,p_id:x.dataset.del});await load()})}
function rplans(){let a=D.events.filter(e=>e.source==='family').sort((x,y)=>x.event_date.localeCompare(y.event_date));$('plist').innerHTML=a.length?a.map(x=>`<div class="item"><div>${db(x.event_date)}</div><div><div class="name">${esc(x.title)}</div><div class="meta">${x.start_time?x.start_time.slice(0,5)+' · ':''}${esc((x.member_names||[]).join(', '))}${x.place?' · '+esc(x.place):''}</div></div><button class="x" data-pe="${x.id}">×</button></div>`).join(''):'<div class="meta">No hay eventos añadidos.</div>';document.querySelectorAll('[data-pe]').forEach(x=>x.onclick=async()=>{await rpc('family_delete_event',{p_code:CODE,p_id:x.dataset.pe});await load()})}
function rc(){let o=['Todos','Joane','Laia','Alain','Athletic','Bilbao Basket','Sestao River'];$('ctabs').innerHTML=o.map(x=>`<button class="${x===C?'on':''}" data-c="${x}">${x}</button>`).join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{C=b.dataset.c;rc()});if(C==='Todos')return $('cbody').innerHTML='<div class="meta">Selecciona una persona o equipo.</div>';if(['Joane','Laia','Alain'].includes(C)){let a=D.recurring.filter(x=>(x.member_names||[]).includes(C));$('cbody').innerHTML=a.map(x=>`<div class="item"><div><div class="name">${esc(x.title)}</div><div class="meta">${['','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'][x.weekday]} · ${x.start_time.slice(0,5)}–${x.end_time.slice(0,5)}</div></div></div>`).join('')}else{let a=D.events.filter(x=>x.source_ref===C);$('cbody').innerHTML=a.map(x=>`<div class="item"><div>${db(x.event_date)}</div><div><div class="name">${esc(x.title)}</div><div class="meta">${x.start_time?x.start_time.slice(0,5):'Hora pendiente'} · ${esc(x.place||'')}</div></div></div>`).join('')}}
function renderAll(){rh();rw();rm();rs();rshop();rplans();rc()}
initnav();$('enter').onclick=()=>{CODE=$('code').value.trim().toUpperCase();localStorage.setItem('family_code',CODE);load()};$('code').onkeydown=e=>{if(e.key==='Enter')$('enter').click()};document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{W.setDate(W.getDate()+Number(b.dataset.w)*7);rw()});document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{M.setMonth(M.getMonth()+Number(b.dataset.m));rm()});document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.setMonth(S.getMonth()+Number(b.dataset.s));rs()});$('as').onclick=async()=>{let n=$('sn').value.trim();if(!n)return;await rpc('family_add_shopping',{p_code:CODE,p_item_name:n,p_category:$('sc').value,p_detail:$('sd').value.trim()||null});$('sn').value='';$('sd').value='';await load()};$('ap').onclick=async()=>{let t=$('pn').value.trim(),d=$('pd').value;if(!t||!d)return;await rpc('family_add_event',{p_code:CODE,p_category:$('pt').value,p_title:t,p_event_date:d,p_start_time:$('ph').value||null,p_end_time:null,p_member_names:[$('pw').value],p_place:$('pp').value.trim()||null,p_notes:$('pnotes').value.trim()||null});['pn','pd','ph','pp','pnotes'].forEach(x=>$(x).value='');await load()};if(CODE){$('code').value=CODE;load()}
</script></body></html>
